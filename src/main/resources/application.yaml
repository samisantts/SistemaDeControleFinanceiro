spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:financeiro}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:sua_senha_aqui}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true